<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Planner Studio — Premium Daily Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <h1>Planner Studio</h1>
        <p>Premium Daily Planner demo — image-inspired, not image-pasted.</p>
      </div>
      <div class="topbar-actions">
        <button id="downloadPngBtn" class="btn btn-secondary">Export PNG</button>
        <button id="printBtn" class="btn btn-primary">Print / Save PDF</button>
      </div>
    </header>

    <section class="controls card">
      <div class="control-block upload-block">
        <label class="section-label">Inspiration image</label>
        <label class="upload-drop" for="imageInput">
          <input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp" hidden />
          <span>Upload inspiration image</span>
          <small>Used only to extract palette and influence the decorative feel.</small>
        </label>
        <img id="previewImage" class="preview-image hidden" alt="Inspiration preview" />
      </div>

      <div class="control-block">
        <label class="section-label">Palette</label>
        <div id="paletteRow" class="palette-row"></div>
        <div class="button-row">
          <button id="extractPaletteBtn" class="btn btn-secondary">Extract palette</button>
          <button id="remixBtn" class="btn btn-secondary">Regenerate decor</button>
        </div>
      </div>

      <div class="control-block narrow">
        <label class="section-label" for="styleSelect">Art direction</label>
        <select id="styleSelect">
          <option value="botanical">Botanical Luxe</option>
          <option value="softStripe">Soft Stripe Editorial</option>
          <option value="autumn">Autumn Warmth</option>
        </select>
      </div>
    </section>

    <main class="preview-wrap">
      <div id="plannerPage" class="planner-page">
        <div id="plannerDecorLeft" class="planner-decor planner-decor-left"></div>
        <div id="plannerDecorRight" class="planner-decor planner-decor-right"></div>

        <div class="planner-header">
          <div>
            <div class="eyebrow">Daily Planner</div>
            <h2>Today</h2>
          </div>
          <div class="date-box">
            <span>Date</span>
            <div class="date-line"></div>
          </div>
        </div>

        <div class="planner-grid">
          <div class="left-col">
            <section class="panel panel-olive top3">
              <div class="panel-title">Today’s Top 3</div>
              <div class="top3-list">
                <div class="numbered-line"><span class="num n1">1</span><div class="write-line"></div></div>
                <div class="numbered-line"><span class="num n2">2</span><div class="write-line"></div></div>
                <div class="numbered-line"><span class="num n3">3</span><div class="write-line"></div></div>
              </div>
            </section>

            <section class="panel panel-olive schedule">
              <div class="panel-title">Schedule</div>
              <div id="scheduleRows" class="schedule-rows"></div>
            </section>

            <section class="panel panel-peach gratitude">
              <div class="panel-title">Gratitude</div>
              <div class="gratitude-list">
                <div class="heart-line">♡ <div class="write-line"></div></div>
                <div class="heart-line">♡ <div class="write-line"></div></div>
                <div class="heart-line">♡ <div class="write-line"></div></div>
              </div>
            </section>
          </div>

          <div class="right-col">
            <section class="panel panel-terra todo">
              <div class="panel-title">To-Do List</div>
              <div id="todoList" class="todo-list"></div>
            </section>

            <section class="panel panel-sage notes">
              <div class="panel-title">Notes</div>
              <div class="dot-grid"></div>
            </section>

            <section class="panel panel-gold meals">
              <div class="panel-title">Meals</div>
              <div class="meal-table">
                <div class="meal-row"><span>Breakfast</span><div class="write-line"></div></div>
                <div class="meal-row"><span>Lunch</span><div class="write-line"></div></div>
                <div class="meal-row"><span>Dinner</span><div class="write-line"></div></div>
                <div class="meal-row"><span>Snacks</span><div class="write-line"></div></div>
              </div>
            </section>
          </div>
        </div>

        <div class="planner-footer">
          <div class="footer-line"></div>
          <div class="footer-quote">Make room for what matters.</div>
          <div class="footer-line"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
